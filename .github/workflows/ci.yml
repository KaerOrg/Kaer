name: CI

# La CI tourne sur TOUTE pull request, quelle que soit la branche visée.
#
# Elle ne se déclenchait que sur les PR ciblant `main` (`branches: [main]`). Or les gros
# chantiers avancent en PILE : une PR s'appuie sur la précédente, qui s'appuie sur encore
# une autre, et seule celle du bas vise `main`. Toutes les autres n'avaient donc AUCUN
# check : ni vert, ni rouge, rien. Au 2026-08-03, 8 des 15 PR ouvertes étaient dans ce cas,
# dont toute la pile du plan de sécurité (Epic #315). Une relecture se faisait sans aucun
# signal automatique, sur la seule parole de l'auteur.
#
# Le filtre est retiré plutôt qu'élargi à une liste de préfixes : une liste se périme au
# premier chantier qui invente un nom de branche non prévu, et le silence qu'elle produit
# est invisible (pas de check = pas d'échec, donc rien qui alerte). Le coût est quelques
# minutes de calcul supplémentaires ; l'absence de vérification sur une app de santé coûte
# plus cher.
on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  typecheck-web:
    name: Web — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/web && npx tsc -b --noEmit

  lint-web:
    name: Web — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/web && npx eslint .

  test-web:
    name: Web — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/web && npx vitest run

  # `packages/shared` porte la logique pure partagée par les deux apps (weekDates,
  # rhythmogram, safetySequence…). Ni le vitest web ni le jest mobile ne la ramassent :
  # sans ce job, ses tests n'étaient exécutés par personne en CI.
  test-shared:
    name: Shared — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd packages/shared && npx vitest run

  typecheck-mobile:
    name: Mobile — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/mobile && npx tsc --noEmit

  test-mobile:
    name: Mobile — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/mobile && npx jest --passWithNoTests

  test-edge:
    name: Edge — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/

  test-sql:
    name: SQL — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Postgres éphémère (pglite/WASM) → aucun service container requis.
      # --allow-read (schema.sql + cache npm), --allow-env (config pglite).
      # --no-lock + --node-modules-dir=none : isole ce job du deno.lock partagé
      # (réservé aux Edge Functions) ; pglite est épinglé inline (@0.5.3).
      - run: deno test --allow-read --allow-env --no-lock --node-modules-dir=none supabase/tests/

  ci-ok:
    name: CI — OK
    runs-on: ubuntu-latest
    needs: [typecheck-web, lint-web, test-web, test-shared, typecheck-mobile, test-mobile, test-edge, test-sql]
    steps:
      - run: echo "All checks passed"
